[project]
name = "vow-agent"
version = "0.1.0"
description = "Conversational planning agent for CTV campaigns on Amazon DSP"
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "pyjwt[crypto]>=2.10.0,<3.0.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.4.0",
    "langgraph>=1.2.9",
    "langchain-core>=1.5.1",
    "langchain-openai>=0.3.0",
    # Public-preview governance packages are deliberately pinned together.
    "agent-governance-toolkit==4.1.0",
    "agent-governance-toolkit-core==4.1.0",
]

[dependency-groups]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "pytest-html>=4.1.0",
    "allure-pytest>=2.13.5",
    "jsonschema>=4.23.0",
]
lint = [
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pylint>=3.3.0",
    "pre-commit>=4.3.0",
]
performance = ["locust>=2.31.0"]
evaluation = [
    "deepeval>=2.0.0",
    "ragas>=0.2.0",
]
security = ["bandit>=1.7.10"]

[tool.uv]
required-version = "==0.11.32"
# AGT 4.1's upper bound excludes the cryptography release containing required fixes.
override-dependencies = ["cryptography>=50.0.0,<51.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# The registry's targeting-type declaration is data, not code, so setuptools
# would otherwise leave it out of an install. The Dockerfile copies app/
# wholesale and is unaffected; this is for `pip install .`.
[tool.setuptools.package-data]
"app.knowledge.registry" = ["data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=app --cov-report=term-missing --cov-report=xml:reports/backend-Pytest_coverage.xml --junitxml=reports/backend-Pytest_report.xml --html=reports/backend-Pytest_report.html --self-contained-html"
asyncio_mode = "auto"
