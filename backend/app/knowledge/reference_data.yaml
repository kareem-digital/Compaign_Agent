# Reference values from VOW's platform.
#
# TMP-22: a local file is a stand-in. These are facts about VOW, so they should
# come from VOW - via MCP once the server exists, or the database once we have
# access. Edit `reference.py` to change where they load from; nothing that reads
# them needs to know.
#
# Converges with KNW-01 (the grounded registry, Vishal's lane). That holds
# thousands of entity records - deal IDs, audience sets, ASINs. This holds a
# handful of enumerations. Same idea at different scale, and they should be
# reconciled rather than left as two registries. See PROVISIONAL_DECISIONS.md.

markets:
  - value: GB
    label: United Kingdom
    currency: GBP
  - value: US
    label: United States
    currency: USD
  - value: FR
    label: France
    currency: EUR
  - value: DE
    label: Germany
    currency: EUR

# VOW sells these four creative lengths and nothing else, which is why the
# interface offers them rather than accepting free text.
durations: ["10", "15", "20", "30"]

# CTV providers, their tier, and the ways people refer to them.
#
# `aliases` exist because a trader writes "prime", "Prime Video" or "amazon
# prime" and means the same thing. Matched case-insensitively on word
# boundaries, so "us" inside "audience" cannot match.
#
# "amazon" is deliberately an alias for Prime Video: in a CTV planning
# conversation that is the sensible reading. The confirmation step gives the
# trader a chance to correct it.
providers:
  - value: Prime Video
    aliases: [prime video, prime, amazon prime, amazon]
    tier: AMAZON_OWNED
  - value: Netflix
    aliases: [netflix]
    tier: THIRD_PARTY_PRECURATED
  - value: Disney+
    aliases: [disney+, disney plus, disney]
    tier: THIRD_PARTY_NEEDS_CURATION
  - value: Hulu
    aliases: [hulu]
    tier: THIRD_PARTY_PRECURATED

inventory_tiers:
  - value: AMAZON_OWNED
    label: Amazon-owned
    note: Reach forecast available
  - value: THIRD_PARTY_PRECURATED
    label: Third-party, pre-curated
    note: No reach forecast
  - value: THIRD_PARTY_NEEDS_CURATION
    label: Third-party, needs curation
    note: Rate card only

# Campaign goals — per Schema v4.0 §4.8 and review comments 29-30.
#
# Awareness is the DEFAULT for CTV (not a constant — the trader can change it).
# Non-Awareness goals should be advised against (not blocked) — CTV tracking
# further down the funnel is unreliable on streaming inventory.
# Source: review comment 30: "we don't advise to do non awareness but we should
# not stop the user selecting an alternative."
goals:
  - value: AWARENESS
    label: Awareness
    description: Build brand recognition and visibility
    default: true
    advised_for_ctv: true
  - value: CONSIDERATION
    label: Consideration
    description: Drive interest and intent
    default: false
    advised_for_ctv: false
    advisory_note: "CTV is primarily an awareness channel — tracking consideration metrics on streaming inventory is unreliable. I'd recommend Awareness, but the choice is yours."
  - value: CONVERSION
    label: Conversion
    description: Drive purchases or specific actions
    default: false
    advised_for_ctv: false
    advisory_note: "CTV isn't the strongest channel for conversion tracking — streaming inventory makes attribution difficult. Awareness is more reliable, but you can proceed if that's your goal."

# KPI options per goal — per Schema v4.0 §4.8, table "KPI options follow the goal".
# Open decision D12 in schema: ideally from GET /api/strategies/choices/
# Using verified values for Awareness; Consideration/Conversion mapped from schema.
kpis:
  AWARENESS:
    - value: REACH
      label: Unique Reach
      description: Number of unique viewers reached
      default: true
    - value: FREQUENCY
      label: Frequency
      description: Average number of times each viewer sees the ad
      default: false
  CONSIDERATION:
    - value: CTR
      label: Click-Through Rate
      description: Percentage of viewers who click the ad
      default: true
    - value: CPDPV
      label: Cost Per Detail Page View
      description: Cost per Amazon product page visit
      default: false
  CONVERSION:
    - value: CPA
      label: Cost Per Acquisition
      description: Cost per completed action or purchase
      default: true
    - value: ROAS
      label: Return on Ad Spend
      description: Revenue generated per pound spent
      default: false
