apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vow-agent.labels" . | nindent 4 }}
    {{- include "vow-agent.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
    tags.datadoghq.com/env: {{ .Values.deploymentEnvironment | quote }}
    tags.datadoghq.com/service: vow-agent-backend
    tags.datadoghq.com/version: {{ .Values.image.tag | quote }}
spec:
  replicas: {{ .Values.backend.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "vow-agent.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "vow-agent.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
        tags.datadoghq.com/env: {{ .Values.deploymentEnvironment | quote }}
        tags.datadoghq.com/service: vow-agent-backend
        tags.datadoghq.com/version: {{ .Values.image.tag | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: "{{ required "image.registry is required" .Values.image.registry }}/{{ required "image.backendRepository is required" .Values.image.backendRepository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
          env:
            - name: ENVIRONMENT
              value: {{ required "backend.runtimeEnvironment is required" .Values.backend.runtimeEnvironment | quote }}
            - name: API_PREFIX
              value: {{ .Values.backend.apiPrefix | quote }}
            - name: DEBUG
              value: "false"
            - name: LOG_LEVEL
              value: INFO
            - name: LOG_FORMAT
              value: json
            - name: LOG_FILE
              value: ""
            - name: USE_MEMORY_CHECKPOINTER
              value: "true"
            - name: USE_MOCK_MCP
              value: "true"
            - name: CORS_ORIGINS
              value: {{ .Values.backend.corsOrigins | toJson | quote }}
          readinessProbe:
            httpGet:
              path: {{ printf "%s/health/ready" .Values.backend.apiPrefix }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: {{ printf "%s/health/live" .Values.backend.apiPrefix }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vow-agent.labels" . | nindent 4 }}
    {{- include "vow-agent.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    {{- include "vow-agent.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 80
      targetPort: http
