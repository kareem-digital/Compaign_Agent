apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vow-agent.labels" . | nindent 4 }}
    {{- include "vow-agent.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
    tags.datadoghq.com/env: {{ .Values.deploymentEnvironment | quote }}
    tags.datadoghq.com/service: vow-agent-frontend
    tags.datadoghq.com/version: {{ .Values.image.tag | quote }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "vow-agent.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "vow-agent.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
        tags.datadoghq.com/env: {{ .Values.deploymentEnvironment | quote }}
        tags.datadoghq.com/service: vow-agent-frontend
        tags.datadoghq.com/version: {{ .Values.image.tag | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: "{{ required "image.registry is required" .Values.image.registry }}/{{ required "image.frontendRepository is required" .Values.image.frontendRepository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
          readinessProbe:
            httpGet:
              path: /agent/
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /agent/
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vow-agent.labels" . | nindent 4 }}
    {{- include "vow-agent.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    {{- include "vow-agent.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
