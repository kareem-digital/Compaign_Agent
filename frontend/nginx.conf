server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = / {
        return 302 /agent/;
    }

    location = /agent {
        return 302 /agent/;
    }

    # Standalone SPA routes fall back to the standalone entry point. Everything
    # this block serves is index.html, so no-store here covers /agent/ and every
    # deep link too — an exact-match location would not, since the try_files
    # fallback resolves inside this block rather than re-matching.
    location /agent/ {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /agent/index.html;
    }

    # Fingerprinted standalone assets can be cached aggressively.
    location /agent/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The remote entry is the manifest hosts resolve chunk names through, and it
    # is not fingerprinted — caching it pins hosts to a stale chunk graph. CORS
    # is restated because add_header is not inherited once a block sets its own.
    location = /mfe/remoteEntry.js {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Federation files are fetched by hosts on other origins. Missing chunks
    # must be a real 404 rather than an HTML SPA fallback.
    location /mfe/ {
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    location /mfe/assets/ {
        expires 1y;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        return 404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
